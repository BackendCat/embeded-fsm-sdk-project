; PlatformIO integration for FSM-Lang.
;
;   pio run                  ; build every env (native + uno)
;   pio run -e native        ; build the host-simulation env
;   pio run -e uno -t upload ; flash a real Arduino Uno
;
; A pre-build script (scripts/fsm_generate.py) runs `fsm generate` into
; src/gen/ before compilation. The `fsm` binary is `fsm` on PATH unless
; the FSM environment variable points at one.
;
; Two targets prove the SAME generated C is genuinely portable:
;   * native : compiles + runs on the desktop (host-simulation platform).
;   * uno    : the canonical 8-bit AVR embedded target (ATmega328P).
; The only platform-specific source is src/hal.c's one `#if ARDUINO`.

[env]
extra_scripts = pre:scripts/fsm_generate.py
; The strict contract every FSM-Lang integration uses. `-std=c99` is set
; per-env below (PlatformIO's gcc defaults to gnu; we force ISO C99).
build_flags =
    -Wall
    -Wextra
    -Wpedantic
    -Werror

[env:native]
platform = native
; Host build: the bare-main driver in src/main.c, NOT the Arduino sketch.
build_src_filter = +<*> -<main_arduino.cpp>
build_flags =
    ${env.build_flags}
    -std=c99

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; Firmware build: the Arduino setup()/loop() sketch, NOT the bare main()
; (the Arduino core owns main()).
build_src_filter = +<*> -<main.c>
; -Wpedantic on the Arduino core headers is noisy and not our code's
; contract; keep -Wall -Wextra -Werror on the firmware, drop -Wpedantic
; here. The generated C itself is -Wpedantic-clean (proven by the native
; env + the host gcc gate in integration_examples.rs).
build_flags =
    -Wall
    -Wextra
    -Werror
    -std=gnu99
