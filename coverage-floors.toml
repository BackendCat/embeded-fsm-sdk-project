# ============================================================================
# Phase-6.0-W4 — Rust coverage RATCHET floors (the single source of truth)
# ============================================================================
#
# Doc 32 §W4. This file is the COMMITTED, REVIEWABLE ratchet state — the
# `tests/conformance/COVERAGE_MAP.md` analogue (a recorded artifact, GT-9
# discipline): the measured baseline, the enforced Day-1 floor, the
# climbed-to target, and the enumerated per-entry exclusion allowlist, all
# in one auditable place.
#
# ─────────────────────────────────────────────────────────────────────────
# THE RATCHET CONTRACT (Doc 32 §W4 (3) — read before editing)
# ─────────────────────────────────────────────────────────────────────────
# - `measured_*` : the REAL per-package coverage measured on 2026-05-18 with
#   `cargo +nightly llvm-cov --branch` (v0.8.7). Honest numbers — some are
#   low; a low honest floor that ratchets UP beats a gamed high one
#   (Doc 32 §W4 §5.4 brutal-honesty). These are recorded for provenance and
#   are NOT the gate input — `floor_*` is.
# - `floor_*` : the ENFORCED Day-1 floor = `floor(measured − 2%)`
#   (Doc 32 §W4 (3)). The `scripts/coverage-gate.py` gate FAILS CI when a
#   package's freshly-measured coverage drops below its `floor_*`.
# - MONOTONIC NON-DECREASING (Doc 32 §W4 (3)): a `floor_*` may only ever be
#   RAISED, never lowered. `scripts/coverage-gate.py --check-monotonic`
#   (run in the lane against the git-`HEAD~`/base copy) FAILS if any
#   `floor_*` in the working tree is BELOW the committed-baseline value.
#   The ratchet climbs toward `target_*`; it never slides back.
# - `target_*` : the climbed-to TARGET (Doc 32 §W4 (3)) — line 85 / branch
#   75, `fsm-verify` stricter line 90 / branch 80. These are the goal the
#   post-W4 ratchet ascends to over time. They are RECORDED here, NOT a
#   Day-1 requirement: W4's MVP is the mechanism + the measured Day-1 floors
#   + the non-vacuity proof, not reaching 85/75 this wave (Doc 32 §W4 +
#   the brief: "you are NOT required to add tests to reach 85/75 this wave").
#
# ─────────────────────────────────────────────────────────────────────────
# NEVER-GAME (Doc 32 §W4 §5.4 — the cardinal W4 sin)
# ─────────────────────────────────────────────────────────────────────────
# These floors were measured against the EXISTING behavioural test suite.
# NO assertion-free line-execution test was added to inflate any baseline
# (that would corrupt the floor permanently). Raising a `floor_*` is only
# legitimate after BEHAVIOURAL §5.4 tests genuinely lift the measured number;
# the gate credits only coverage produced by the real suite.
#
# ─────────────────────────────────────────────────────────────────────────
# HOW TO RAISE A FLOOR (the ongoing post-W4 ratchet)
# ─────────────────────────────────────────────────────────────────────────
# 1. Add BEHAVIOURAL tests (assert behaviour — not assertion-free
#    line-execution) that genuinely lift `measured_*`.
# 2. Re-measure: `python3 scripts/coverage-gate.py --measure` (or the lane).
# 3. Raise `floor_*` to the new `floor(measured − 2%)` (only UP).
# 4. The monotonic check enforces it can never be lowered again.

# Toolchain provenance (Doc 32 §W4 — the floor is MEASURED, never guessed):
#   measured 2026-05-18, cargo-llvm-cov 0.8.7,
#   `cargo +nightly llvm-cov --branch --no-cfg-coverage -p <pkg> --json
#    --summary-only` on rustc 1.97.0-nightly (507271bc1 2026-05-17).
#   `--branch` is an UNSTABLE flag and is NIGHTLY-ONLY in cargo-llvm-cov
#   (stable rejects it: "--branch flag requires nightly toolchain"). The
#   `coverage-rust` lane therefore uses an additive-isolated `nightly`
#   toolchain — the EXACT `sca`-job pattern (GT-1), nightly instead of
#   stable for the SAME reason `sca` uses stable: the tool needs it. The
#   project's pinned 1.75 build matrix is NEVER touched (additive isolation).

[meta]
schema = 1
measured_on = "2026-05-18"
cargo_llvm_cov_version = "0.8.7"
nightly_rustc = "1.97.0-nightly (507271bc1 2026-05-17)"
# The per-package metric is line + branch %, from the EXISTING behavioural
# suite. fsm-lsp is measured from its 77-test lib unit suite (see
# [exclusions.fsm-lsp-integration-test] for why its subprocess-stdio
# integration test is not a coverage-measurement vehicle).

# Climbed-to TARGETS (Doc 32 §W4 (3)) — the goal the ratchet ascends to,
# NOT a Day-1 requirement. Default for every package:
[targets.default]
line = 85
branch = 75
# fsm-verify stricter (Doc 32 §W4 (3)): it is the verification keystone's
# crate — a higher bar is intentional.
[targets.fsm-verify]
line = 90
branch = 80

# ─────────────────────────────────────────────────────────────────────────
# PER-PACKAGE measured baseline + enforced Day-1 floor
# floor_* = floor(measured_* − 2)   ·   ratchets UP only   ·   never gamed
# ─────────────────────────────────────────────────────────────────────────

[package.fsm-diagnostics]
measured_line = 92.06
measured_branch = 100.00
floor_line = 90
floor_branch = 98

[package.fsm-lexer]
measured_line = 89.17
measured_branch = 92.86
floor_line = 87
floor_branch = 90

[package.fsm-parser]
