[package]
name = "fsm-analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FSM Studio semantic analyzer — symbol table, type check, determinism, AST→IR lowering"

# Inherits the workspace lint policy (root `[workspace.lints.rust]`):
# `unreachable_pub = "warn"`. Doc 00 §11.4x (the §11.31 deferral closed).
[lints]
workspace = true

[dependencies]
# Analyzer emits `Diagnostic` values for every semantic / determinism check
# and consumes the `Span` / `DiagnosticCode` types from the foundation crate.
fsm-diagnostics = { workspace = true }
# Consumed: the typed AST view (`fsm_parser::ast::*`) plus `ParseResult`.
fsm-parser = { path = "../fsm-parser" }
# Produced: the canonical IR document.
fsm-ir = { path = "../fsm-ir", default-features = false }
thiserror = { workspace = true }

[features]
# Forwards to `fsm-ir/schema-validate`, which compiles the IR-invariant
# gate (PD-3). On by default so dev/test builds validate the IR the
# analyzer emits against `schema/ir/1.0.0/model.json` at the lowering
# boundary. The gate *call* in `lower.rs` is additionally
# `#[cfg(debug_assertions)]`, so `cargo build --release` is zero runtime
# cost even with the feature on. `--no-default-features` drops the gate and
# the `jsonschema` dependency entirely.
default = ["schema-validate"]
schema-validate = ["fsm-ir/schema-validate"]

[dev-dependencies]
insta = { workspace = true }
