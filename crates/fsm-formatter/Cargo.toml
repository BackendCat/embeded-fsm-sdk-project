[package]
name = "fsm-formatter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FSM Studio canonical formatter — CST in, formatted .fsm text out"

[dependencies]
# Formatter walks the CST only. By design, it does NOT depend on the
# analyzer or IR (Doc 23 §4 / Doc 20 §11.5). It still surfaces parse-time
# Diagnostic values from the CST builder, hence fsm-diagnostics.
fsm-diagnostics = { workspace = true }
fsm-lexer = { path = "../fsm-lexer" }
fsm-parser = { path = "../fsm-parser" }
rowan = { workspace = true }

[dev-dependencies]
# Golden-file snapshots; the second-pass idempotency assertion is a plain
# equality check.
insta = { workspace = true }
