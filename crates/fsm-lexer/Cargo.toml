[package]
name = "fsm-lexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FSM Studio tokenizer — zero-copy, no_std-friendly lexer over .fsm source"

# Inherits the workspace lint policy (root `[workspace.lints.rust]`):
# `unreachable_pub = "warn"`. Doc 00 §11.4x (the §11.31 deferral closed).
[lints]
workspace = true

[dependencies]
# Only foundation crate allowed here per Doc 23 §4 + Doc 00 §7.1:
# fsm-diagnostics owns the `Span` type the lexer emits with every token.
fsm-diagnostics = { workspace = true }

[dev-dependencies]
# Snapshot tests over representative .fsm sources — Doc 20 §3, Doc 24.
insta = { workspace = true }
