[package]
name = "fsm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FSM Studio command-line interface — the `fsm` binary"

# Inherits the workspace lint policy (root `[workspace.lints.rust]`):
# `unreachable_pub = "warn"`. Doc 00 §11.4x (the §11.31 deferral closed).
[lints]
workspace = true

[[bin]]
name = "fsm"
path = "src/main.rs"

[dependencies]
# Aggregates the v1.0 pipeline. Deferred crates (codegen-cpp, lsp, wasm)
# are intentionally absent here; they land in v1.1+. The CLI renders
# diagnostics through miette, so it pulls in fsm-diagnostics with the
# `miette` feature explicitly enabled. The `serde` feature exposes
# Diagnostic for the `--json` formatter.
fsm-diagnostics = { workspace = true, features = ["miette", "serde"] }
fsm-lexer = { path = "../fsm-lexer" }
fsm-parser = { path = "../fsm-parser" }
fsm-analyzer = { path = "../fsm-analyzer" }
fsm-ir = { path = "../fsm-ir" }
fsm-codegen-c = { path = "../fsm-codegen-c" }
fsm-simulator = { path = "../fsm-simulator" }
# v1.4-W1: the verification core, surfaced as the `fsm verify` subcommand
# (the canonical pipeline interface — Doc 30 top-section TL decision +
# the pipeline-before-UI bar). The CLI is a thin frontend over this lib;
# the editor/LSP later reuse the SAME crate ⇒ CLI ≡ editor by construction.
fsm-verify = { path = "../fsm-verify" }
fsm-formatter = { path = "../fsm-formatter" }

clap = { workspace = true }
miette = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Toml 0.8 is the newest 0.x that still compiles on Rust 1.75 (Doc 23 §2);
# newer 0.9 bumps the MSRV. The CLI uses it only to parse fsm.toml.
toml = "0.8"

[features]
# Opt-in switch that arms the ONE writer of
# `tests/conformance/COVERAGE_MAP.md` (the G7 `regenerate_coverage_map`
# `#[ignore]`d test). Off by default so neither the normal suite nor a
# stray `--ignored` run can rewrite the generated map unintentionally;
# the map's byte-derivability is asserted (read-only) without it.
regen-coverage-map = []

[dev-dependencies]
# Integration tests spawn the `fsm` binary via assert_cmd; predicates
# powers the stdout/stderr matching; tempfile gives every test its own
# clean output directory.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
