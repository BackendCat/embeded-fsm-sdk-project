[package]
name = "fsm-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FSM Studio canonical IR — pure data types + serde JSON serialization"

[dependencies]
# Per Doc 23 §4 / Doc 20 §11.5 + Doc 00 §7.1: fsm-ir depends on
# fsm-diagnostics for Span / SourceLocation (previously imported from
# fsm-parser, which created a cycle risk once the parser began emitting
# diagnostics). No other foundation types may be imported here.
fsm-diagnostics = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Used only by tests/schema_validation.rs to validate that the JSON Schema
# under `schema/ir/1.0.0/model.json` accepts representative IR documents
# and rejects malformed ones. Pinned per task brief.
jsonschema = { version = "0.17", default-features = false }
serde_json = { workspace = true }
