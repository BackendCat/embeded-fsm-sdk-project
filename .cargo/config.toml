# Shared build artifact directory for ALL worktrees of this repo.
#
# WHY: each `git worktree` otherwise gets its own 1-3 GB `target/`. With
# parallel implementation waves that multiplied disk usage and hit 100%
# disk, killing or near-killing background agents 4× during v1.0 dev
# (see plan retrospective PD-1). A single shared target dir means N
# parallel worktrees consume ~1× target, not ~N×.
#
# This file is git-tracked, so `git worktree add` checks it out into
# every worktree; cargo (which searches up from CWD for .cargo/config.toml)
# resolves it from the worktree root and routes all builds here.
#
# Concurrency: cargo's per-target build lock serializes simultaneous
# builds against this dir. That trades a little wall-clock for a large
# disk + correctness win — the right tradeoff given the incident history.
#
# Path is an absolute sibling of the repo so it is shared regardless of
# which worktree cargo runs from, and is NOT inside any worktree (so
# `git worktree remove` never deletes the cache).

[build]
target-dir = "/root/dev/embeded-fsm-sdk-target"
